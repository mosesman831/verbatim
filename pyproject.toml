[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verbatim-memory"
version = "1.0.0"
description = "Evidence-first, zero-generation memory engine and Hermes memory provider"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Verbatim contributors"}]
keywords = [
    "agent-memory",
    "ai-agents",
    "evidence",
    "llm",
    "local-first",
    "memory",
    "provenance",
    "retrieval",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # V3 vault (SPEC_V3 §35): reviewed AEAD provider — no custom crypto,
    # no plaintext fallback. Required for V3.0, not an optional extra.
    "cryptography>=42,<51",
]

[project.optional-dependencies]
semantic = ["numpy>=1.26,<3"]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3,<4",
    "pyyaml>=6,<7",
    # The packaging tests build a wheel with --no-build-isolation, which needs
    # the build backend importable in the environment. A venv install of
    # `.[dev]` otherwise has no setuptools at all, and the fixture fails with
    # BackendUnavailable instead of testing the wheel.
    "setuptools>=77",
]

[project.urls]
Homepage = "https://github.com/mosesman831/verbatim"
Repository = "https://github.com/mosesman831/verbatim"
Issues = "https://github.com/mosesman831/verbatim/issues"
Releases = "https://github.com/mosesman831/verbatim/releases"

[project.entry-points."hermes_agent.memory_providers"]
verbatim = "verbatim:register"

[project.scripts]
verbatim = "verbatim.cli:main"
verbatim-service = "verbatim.service.__main__:main"
verbatim-mcp = "verbatim.api_v3.mcp:main"

[tool.setuptools.packages.find]
include = ["verbatim*"]

[tool.setuptools.package-data]
verbatim = ["plugin.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"