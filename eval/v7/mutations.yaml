# Declared mutation set — SPEC_V7 §35 / V7-35.01 (V4-52.* discipline carried).
#
# Each entry under `mutations:` removes exactly one landed enforcement
# check via exact-string replacement; the named pytest node ids fail
# under the mutant (outcome=killed) or the seam is an enforcement gap.
# Runner: tools/run_mutation.py — sequential, ≤60s per-test cap,
# SHA-256 verified restore after every mutation.
#
# `pending:` carries the §35 targets whose owning enforcement has not
# landed or cannot yet be killed by an existing test — each names the
# blocking reason in `pending_reason`. The loader reads only
# `doc["mutations"]` and ignores `pending:` entirely, so pending entries
# are deliberately NOT runnable (a null anchor under `mutations:` would
# crash apply_mutation).
version: 1
